# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# The Azure Databricks Genie connection (AzureDatabricksGenieOBO) and toolbox
# (databricks-tools) are created out-of-band via the portal/CLI (see README)
# because the OAuth connection needs a Databricks custom-app client id + secret.
# This manifest defines only the model + hosted agent; the agent reaches the
# toolbox at runtime with its own agent identity via TOOLBOX_NAME.
requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: agent-framework-agent-databricks
services:
  ai-project:
    host: azure.ai.project
    deployments:
      # Reuse an existing model deployment in your Foundry project.
      - name: gpt-4.1
        model:
          format: OpenAI
          name: gpt-4.1
        version: '2025-04-14'
        sku:
          name: GlobalStandard
          capacity: 10

  agent-framework-agent-databricks:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Streaming
        - Azure Databricks
        - Genie
    project: src/agent-framework-agent-databricks
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-agent-databricks
    description: An Agent Framework hosted agent that answers questions over an Azure Databricks Genie space on behalf of the signed-in user.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # Name of the toolbox created via CLI/portal (see README step 3).
      - name: TOOLBOX_NAME
        value: databricks-tools
      - name: ENABLE_TOOLBOX
        value: 'true'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
