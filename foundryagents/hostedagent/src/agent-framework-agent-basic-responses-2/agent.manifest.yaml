name: agent-framework-agent-basic-citadel
description: >
  A basic Agent Framework agent hosted by Foundry.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
    - Streaming
template:
  name: agent-framework-agent-basic-citadel
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
resources:
  - kind: model
    id: citadel-hub-connection/gpt-5-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
