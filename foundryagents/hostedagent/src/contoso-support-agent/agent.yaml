# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: contoso-support-agent
description: |
  An Agent Framework agent with Retrieval Augmented Generation (RAG) capabilities
  backed by Azure AI Search, hosted using the Responses protocol.
  (Clone of agent-framework-agent-azure-search-rag-responses with a fresh name.)
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: "1"
  memory: 2Gi
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: gpt-5.4-mini
  - name: AZURE_SEARCH_ENDPOINT
    value: https://aiservicesktdpsearch.search.windows.net
  - name: AZURE_SEARCH_INDEX_NAME
    value: contoso-outdoors
